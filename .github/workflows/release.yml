# Builds TextCraft for Windows and Linux and publishes a release when a version
# tag is pushed, e.g.:   git tag v1.1.0 && git push origin v1.1.0
# The tag must match the version in Cargo.toml.

name: Fabriquer une version

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    name: Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Le tag correspond à la version de Cargo.toml
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          v=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          if [ "v$v" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Cargo.toml indique $v mais le tag est $GITHUB_REF_NAME"
            exit 1
          fi
      - name: Compiler
        run: cargo build --release --locked
      - name: Préparer
        shell: bash
        run: |
          mkdir out
          cp target/release/textcraft.exe out/TextCraft.exe
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: out/TextCraft.exe

  linux:
    name: Linux
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Bibliothèques système pour les tests
        run: sudo apt-get update && sudo apt-get install -y pkg-config libxkbcommon-dev libwayland-dev libxcb1-dev
      - name: Tests
        run: cargo test --locked
      - name: Compiler (compatible Ubuntu 20.04 et plus récent)
        run: |
          pip install cargo-zigbuild
          cargo zigbuild --release --locked --target x86_64-unknown-linux-gnu.2.31
      - name: Préparer
        run: |
          mkdir -p out/TextCraft-linux
          cp target/x86_64-unknown-linux-gnu/release/textcraft out/TextCraft-linux/textcraft
          cp linux/install.sh linux/textcraft.desktop linux/LISEZMOI.txt out/TextCraft-linux/
          chmod 755 out/TextCraft-linux/textcraft out/TextCraft-linux/install.sh
          chmod 644 out/TextCraft-linux/textcraft.desktop out/TextCraft-linux/LISEZMOI.txt
          tar czf out/TextCraft-linux.tar.gz --owner=0 --group=0 -C out TextCraft-linux
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: out/TextCraft-linux.tar.gz

  publish:
    name: Publier
    needs: [windows, linux]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: files
          merge-multiple: true
      - name: Empreintes de contrôle
        working-directory: files
        run: sha256sum TextCraft.exe TextCraft-linux.tar.gz > SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          name: TextCraft ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            files/TextCraft.exe
            files/TextCraft-linux.tar.gz
            files/SHA256SUMS.txt
